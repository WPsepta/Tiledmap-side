name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        mkdir -p www
        cp index.html www/
        npx cap init "Tiled Side" "com.tiledside.editor" --web-dir=www
        npx cap add android
        npx cap sync
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        
    - name: Configure Gradle Properties
      run: |
        cd android
        echo "android.jetifier.ignorelist=bcprov-jdk18on" >> gradle.properties
        
    - name: Force Clear Gradle Cache
      run: |
        rm -rf ~/.gradle/caches
        cd android
        ./gradlew clean
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TiledSide-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
