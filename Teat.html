<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tiled Side</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; background: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- ANIMASI HIDE UI --- */
        .floating-ui { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body.hide-ui .top-bar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        body.hide-ui .left-toolbar { transform: translate(-150%, -50%); opacity: 0; pointer-events: none; }
        body.hide-ui .tile-slots-container { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
        body.hide-ui #transformPanel { opacity: 0; pointer-events: none; }
        body.hide-ui #toggleUI { background: #f44336; color: white; box-shadow: 0 0 15px #f44336; border-color: #f44336; }

        /* --- TOP BAR --- */
        .top-bar {
            position: absolute; 
            top: calc(15px + env(safe-area-inset-top)); 
            left: 0; right: 0; height: 60px;
            display: flex; justify-content: center; align-items: center;
            background: transparent; z-index: 100; overflow-x: auto; white-space: nowrap;
            pointer-events: none; padding: 0 70px 0 15px;
        }
        .top-bar::-webkit-scrollbar { display: none; }
        .top-group { display: flex; gap: 10px; align-items: center; flex-shrink: 0; pointer-events: auto; }

        /* --- LEFT TOOLBAR --- */
        .left-toolbar {
            position: absolute; top: 50%; 
            left: calc(15px + env(safe-area-inset-left)); 
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
            max-height: 70vh; overflow-y: auto; pointer-events: none;
            padding: 5px 0;
        }
        .left-toolbar::-webkit-scrollbar { display: none; }
        .left-toolbar .btn-icon { pointer-events: auto; }

        /* --- TOMBOL IKON SVG --- */
        .btn-icon {
            background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(255,255,255,0.1);
            color: #888; width: 45px; height: 45px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.2s; padding: 8px; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 14px; font-weight: bold;
        }
        .btn-icon svg { width: 100%; height: 100%; }
        .btn-icon:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.95); }
        .btn-icon.active { background: rgba(33, 150, 243, 0.3); border-color: #2196F3; color: #58b6ff; }

        #btnTileSize {
            color: #58b6ff; font-size: 13px; line-height: 1.2; text-align: center; flex-direction: column;
        }

        #toggleUI {
            position: fixed; 
            top: calc(15px + env(safe-area-inset-top)); 
            right: calc(15px + env(safe-area-inset-right)); 
            z-index: 9999;
            background: rgba(30, 30, 30, 0.8); border: 1px solid rgba(255,255,255,0.1);
            color: #aaa; width: 45px; height: 45px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.3s; padding: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #toggleUI svg { width: 100%; height: 100%; }

        /* --- TOMBOL TOGGLE PALETTE --- */
        #togglePaletteBtn {
            position: fixed; 
            bottom: calc(20px + env(safe-area-inset-bottom)); 
            right: calc(15px + env(safe-area-inset-right)); 
            z-index: 2000; 
            background: rgba(33, 150, 243, 0.85); border: 1px solid #2196F3; 
            color: white; width: 50px; height: 50px; border-radius: 12px;
            display: none; 
            justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.2s; padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #togglePaletteBtn:active { background: #1565C0; transform: scale(0.95); }
        #togglePaletteBtn svg { width: 100%; height: 100%; }

        /* --- AREA KANVAS --- */
        .canvas-container { flex: 1; overflow: hidden; position: relative; background-color: #000000; }
        .map-wrapper {
            width: 2048px; height: 1024px; position: absolute; top: 0; left: 0;
            background-color: #2a2a2a;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            border: 2px solid #444; transform-origin: 0 0; 
        }
        .map-wrapper.no-grid { background-image: none; }

        canvas#mapCanvas { display: block; position: absolute; top: 0; left: 0; }
        canvas#selectionCanvas { display: block; position: absolute; top: 0; left: 0; pointer-events: none; }

        /* --- TILE SLOTS --- */
        .tile-slots-container {
            position: absolute; 
            bottom: calc(20px + env(safe-area-inset-bottom)); 
            left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(30, 30, 30, 0.85);
            padding: 5px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            z-index: 99; max-width: 85vw; 
            overflow-x: auto;
        }
        .tile-slots-container::-webkit-scrollbar { display: none; }
        .tile-slot {
            width: 40px; height: 40px; background: #222; border: 2px solid transparent; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; flex-shrink: 0;
        }
        .tile-slot.selected { border-color: #4CAF50; }
        .tile-slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* --- PANEL TRANSFORMASI --- */
        #transformPanel {
            display: none; position: absolute; 
            top: calc(75px + env(safe-area-inset-top)); 
            left: 50%; transform: translateX(-50%);
            gap: 15px; z-index: 200; align-items: center;
            background: transparent; border: none; box-shadow: none; padding: 0;
        }
        .trans-btn {
            background: rgba(30, 30, 30, 0.8); color: #ccc; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            width: 50px; height: 50px; transition: 0.2s; backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .trans-btn svg { width: 100%; height: 100%; }
        .trans-btn:active { background: #ff9800; color: white; border-color: #ff9800; }

        /* --- MODAL MENU & SETUP --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .modal-box {
            background: #1e1e1e; border: 1px solid #333; border-radius: 15px; padding: 20px; width: 90%; max-width: 350px;
            display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .modal-box h3 { margin: 0 0 15px 0; font-size: 18px; text-align: center; color: #fff; }
        
        .btn-menu { 
            width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: flex-start; gap: 10px;
            background: #2a2a2a; color: #ddd;
        }
        .btn-menu:active { background: #333; }
        .btn-menu.danger { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .btn-menu.success { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }

        /* Setup Modal */
        #setupModal .modal-box { border-color: #4CAF50; }
        .setup-btn { background: #2a2a2a; color: white; padding: 15px; border: 1px solid #444; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%; font-size: 16px;}
        .setup-btn:active { background: #333; }

        /* Input W/H di dalam Menu */
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { flex: 1; background: #111; padding: 10px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .input-box span { font-size: 14px; color: #888; font-weight: bold; }
        .input-box input { width: 100%; background: transparent; border: none; color: white; font-size: 18px; font-weight: bold; outline: none; text-align: center; }

        /* --- PALETTE POP-UP --- */
        #paletteModal { 
            display: none; position: fixed; z-index: 1000; 
            right: 10px; top: calc(75px + env(safe-area-inset-top)); 
            width: 280px; height: 50vh; 
            background: #222; border: 2px solid #2196F3; 
            border-radius: 0; 
            flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden; pointer-events: auto;
            min-width: 200px;
            min-height: 100px;
        }
        .tileset-header { 
            background: #1565C0; 
            padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; 
            cursor: grab; border-radius: 0; flex-shrink: 0;
        }
        .tileset-header:active { cursor: grabbing; }
        .canvas-scroll { 
            flex: 1; position: relative; overflow: hidden; background: #111; padding: 10px; 
        }
        canvas#tilesetCanvas { position: absolute; top: 10px; left: 10px; cursor: crosshair; image-rendering: pixelated; display: block; }

        /* HANDLE RESIZE */
        .resize-grip {
            position: absolute; bottom: 0; right: 0; width: 30px; height: 30px;
            cursor: nwse-resize; z-index: 20;
            background: repeating-linear-gradient(135deg, transparent, transparent 3px, rgba(33, 150, 243, 0.8) 3px, rgba(33, 150, 243, 0.8) 6px); 
        }
        .resize-edge-right {
            position: absolute; top: 10px; right: 0; bottom: 10px; width: 10px; cursor: ew-resize; z-index: 15;
        }
        .resize-edge-bottom {
            position: absolute; bottom: 0; left: 10px; right: 10px; height: 10px; cursor: ns-resize; z-index: 15;
        }
    </style>
</head>
<body>

    <button id="toggleUI" onclick="toggleUI()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
          <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 24S11 12 24 12S44 24 44 24S37 36 24 36S4 24 4 24Z"/>
            <circle cx="24" cy="24" r="6"/>
            <path d="M7 41L41 7"/>
          </g>
        </svg>
    </button>

    <button id="togglePaletteBtn" onclick="togglePaletteVisibility()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
        </svg>
    </button>

    <div class="top-bar floating-ui">
        <div class="top-group">
            <button class="btn-icon" onclick="openMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="#58b6ff"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
            </button>
            
            <button class="btn-icon" style="color: #4CAF50;" onclick="saveTMX()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M5 3h12l4 4v14H3V3h2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 3v6h10V3M7 21v-7h10v7" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            
            <button class="btn-icon" onclick="undo()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="btn-icon" onclick="redo()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="m15 14 5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="btn-icon" onclick="fitToScreen()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M3 15v4a2 2 0 0 0 2 2h4" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"/></svg>
            </button>
            
            <button id="btnTileSize" class="btn-icon" onclick="toggleTileSize()">32x32</button>

            <button class="btn-icon" style="color: #FFEB3B;" onclick="document.getElementById('fileInput').click()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M3 19V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10H3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 17V9m-3 3 3-3 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
        <div class="map-wrapper" id="mapWrapper">
            <canvas id="mapCanvas" width="2048" height="1024"></canvas>
            <canvas id="selectionCanvas" width="2048" height="1024"></canvas>
        </div>
    </div>

    <div class="left-toolbar floating-ui">
        <button id="btnBrush" class="btn-icon active" onclick="setTool('brush')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
              <g stroke="#263449" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 29L29 9Q32 6 35 9L39 13Q42 16 39 19L20 35"/>
                <path d="M14 29Q9 33 7 40Q15 40 20 35Z" fill="#2587FF"/>
                <path d="M17 27L25 35" stroke="#FFFFFF"/>
                <path d="M29 11L36 18" stroke="#8DC5FF"/>
              </g>
            </svg>
        </button>
        
        <button id="btnEraser" class="btn-icon" onclick="setTool('eraser')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
              <g stroke="#263449" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8Q13 8 11 11L6 16Q3 19 6 22L25 41Q27 43 30 41L42 29Q44 27 41 24L23 9Q20 6 16 8Z" fill="#2788FF"/>
                <path d="M6 22L25 41Q27 43 30 41L35 36L17 18Z" fill="#FFFFFF"/>
                <path d="M17 18L35 36" stroke="#263449"/>
              </g>
            </svg>
        </button>
        
        <button id="btnTransform" class="btn-icon" onclick="setTool('transform')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><rect x="6" y="6" width="12" height="12" rx="1" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        
        <button id="btnHand" class="btn-icon" onclick="setTool('hand')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M12 2v20M2 12h20M12 2 8.5 5.5M12 2l3.5 3.5M22 12l-3.5-3.5M22 12l-3.5 3.5M12 22l-3.5-3.5M12 22l3.5-3.5M2 12l3.5-3.5M2 12l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        
        <button id="btnGrid" class="btn-icon" onclick="toggleGrid()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><g stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="5" height="5" rx="1"/><rect x="3" y="17" width="5" height="5" rx="1"/><rect x="10" y="17" width="5" height="5" rx="1"/><rect x="17" y="17" width="5" height="5" rx="1"/></g></svg>
        </button>
    </div>

    <div class="tile-slots-container floating-ui" id="tileSlots"></div>

    <div id="transformPanel">
        <button class="trans-btn" onclick="transformMapTile('left')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M4 10V4m0 0h6M4 4l4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 8.5A8 8 0 1 1 4 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="trans-btn" onclick="transformMapTile('mirrorH')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M12 3v18" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/><path d="M9 6 3 12l6 6V6ZM15 6l6 6-6 6V6Z" fill="currentColor"/></svg>
        </button>
        <button class="trans-btn" onclick="transformMapTile('mirrorV')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/><path d="M6 9 12 3l6 6H6ZM6 15l6 6 6-6H6Z" fill="currentColor"/></svg>
        </button>
        <button class="trans-btn" onclick="transformMapTile('right')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M20 10V4m0 0h-6m6 0-4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 8.5A8 8 0 1 0 20 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none;">

    <div id="menuModal" class="modal-overlay">
        <div class="modal-box">
            <h3>⚙️ Menu Tiled Side</h3>
            
            <div class="input-row">
                <div class="input-box">
                    <span>W</span>
                    <input type="number" id="inputWidth" value="64" min="1" oninput="checkInputChanges()">
                </div>
                <div class="input-box">
                    <span>H</span>
                    <input type="number" id="inputHeight" value="32" min="1" oninput="checkInputChanges()">
                </div>
            </div>
            <button id="btnSaveSize" class="btn-menu success" style="display: none; justify-content: center;" onclick="applyMapSize(false)">✔ Terapkan Ukuran Baru</button>

            <button class="btn-menu" onclick="saveToFolder()">📂 Simpan ke Folder (Beta)</button>
            <button class="btn-menu" onclick="savePNG()">⬇️ Download File PNG</button>
            <button class="btn-menu danger" onclick="createNewMap()">🗑️ Buat Map Baru (Hapus)</button>
            <button class="btn-menu" style="justify-content: center; margin-top: 10px;" onclick="closeMenu()">Tutup</button>
        </div>
    </div>

    <div id="setupModal" class="modal-overlay">
        <div class="modal-box">
            <h3>👋 Selamat Datang di Tiled Side!</h3>
            <p style="text-align:center; font-size:13px; color:#888; margin-bottom:15px;">Mau bikin peta ukuran berapa hari ini?</p>
            
            <button class="setup-btn" onclick="startSetup(64, 32)">📏 64 x 32 (Landscape)</button>
            <button class="setup-btn" onclick="startSetup(32, 32)">⬜ 32 x 32 (Kotak)</button>
            <button class="setup-btn" onclick="startSetup(64, 64)">🏙️ 64 x 64 (Kota Besar)</button>
        </div>
    </div>

    <div id="paletteModal">
        <div class="tileset-header" id="dragHeaderPalette">
            <span style="font-weight: bold; color: white; pointer-events: none;">Pilih Tile</span>
            <div style="display:flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; align-items: center;">
                <button id="btnSnapMode" style="background: #555; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-weight:bold; font-size: 12px;" onclick="toggleSnapMode()">🧲 Snap: OFF</button>
                <button id="btnMoveImage" style="background: #ff9800; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-weight:bold; font-size: 12px;" onclick="toggleMoveMode()">✋ Geser</button>
            </div>
        </div>
        <div class="canvas-scroll" id="canvasScroll">
            <canvas id="tilesetCanvas"></canvas>
        </div>
        <div class="resize-grip" id="paletteResizeGrip"></div>
        <div class="resize-edge-right" id="resizeRight"></div>
        <div class="resize-edge-bottom" id="resizeBottom"></div>
    </div>

    <script>
        let TILE_SIZE = 32;
        let MAP_WIDTH = 64 * TILE_SIZE;
        let MAP_HEIGHT = 32 * TILE_SIZE;

        const mapCanvas = document.getElementById('mapCanvas');
        const mCtx = mapCanvas.getContext('2d');
        const selectionCanvas = document.getElementById('selectionCanvas');
        const sCtx = selectionCanvas.getContext('2d');
        const tilesetCanvas = document.getElementById('tilesetCanvas');
        const tCtx = tilesetCanvas.getContext('2d');
        const mapWrapper = document.getElementById('mapWrapper');
        const canvasContainer = document.getElementById('canvasContainer');
        const btnSaveSize = document.getElementById('btnSaveSize');
        
        let tilesetImage = null;
        let selectedTile = { img: null, x: 0, y: 0, w: 32, h: 32 };

        let isMoveMode = false; 
        let isSnapMode = false; 
        let imgOffsetX = 0, imgOffsetY = 0;
        let isDraggingImage = false;
        let dragStartX = 0, dragStartY = 0;

        let currentTool = 'brush'; 
        let isDrawing = false;
        let slotHistory = []; 
        let zoomLevel = 1.0, panX = 0, panY = 0;
        let isTransforming = false;
        let transX = 0, transY = 0;

        let activePointers = new Set();

        function checkIfShrinkingCutsContent(newW, newH) {
            if (newW >= MAP_WIDTH && newH >= MAP_HEIGHT) return false; 
            const imgData = mCtx.getImageData(0, 0, MAP_WIDTH, MAP_HEIGHT).data;
            let maxX = 0, maxY = 0;
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const index = (y * MAP_WIDTH + x) * 4;
                    if (imgData[index + 3] > 0) { if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
                }
            }
            if (newW < maxX + TILE_SIZE || newH < maxY + TILE_SIZE) { return true; }
            return false;
        }

        function applyMapSize(isInitialLoad = false) {
            const tw = parseInt(document.getElementById('inputWidth').value);

            let newW = tw * TILE_SIZE; let newH = th * TILE_SIZE;

            if (checkIfShrinkingCutsContent(newW, newH) && MAP_WIDTH > 0) {
                alert("❌ GAGAL MENGECILKAN!\n\nMasih ada gambar di area pinggir."); return;
            }

            const tempCanvas = document.createElement('canvas');

        function saveTMX() {
            const cols = MAP_WIDTH / TILE_SIZE;
            const rows = MAP_HEIGHT / TILE_SIZE;
            
            let csvData = "";
            for (let y = 0; y < rows; y++) {
                let rowStr = [];
                for (let x = 0; x < cols; x++) {
                    rowStr.push("0");
                }
                csvData += rowStr.join(",");
                if (y < rows - 1) csvData += ",\n";
            }

            const tmxContent = `<?xml version="1.0" encoding="UTF-8"?>
<map version="1.10" tiledversion="1.10.2" orientation="orthogonal" renderorder="right-down" width="${cols}" height="${rows}" tilewidth="${TILE_SIZE}" tileheight="${TILE_SIZE}" infinite="0" nextlayerid="2" nextobjectid="1">
 <layer id="1" name="Tile Layer 1" width="${cols}" height="${rows}">
  <data encoding="csv">
${csvData}
  </data>
 </layer>
</map>`;

            const blob = new Blob([tmxContent], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'tiled_side_map.tmx';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function toggleUI() { document.body.classList.toggle('hide-ui'); }
        function updateTransform() { mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`; }
        function fitToScreen() {

            zoomLevel = Math.min(cw / MAP_WIDTH, ch / MAP_HEIGHT) * 0.85;

        let history = [], historyIndex = -1;
        function saveState() {
            if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
            history.push(mapCanvas.toDataURL()); historyIndex++;
            if (history.length > 20) { history.shift(); historyIndex--; }
        }
        function undo() { if (historyIndex > 0) { historyIndex--; loadState(history[historyIndex]); } }
        function redo() { if (historyIndex < history.length - 1) { historyIndex++; loadState(history[historyIndex]); } }
        
        function loadState(dataURL) {

        function toggleMoveMode() {

            if (isMoveMode) { btn.classList.add('active'); btn.style.background = '#2196F3'; tilesetCanvas.style.cursor = 'grab'; }

            if (isSnapMode) {
                btn.classList.add('active');
                btn.style.background = '#4CAF50';

                if (tilesetImage) {
                    imgOffsetX = Math.round(imgOffsetX / TILE_SIZE) * TILE_SIZE;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();

                img.src = event.target.result;

        });

        function drawTileset() {
            if (!tilesetImage) return;
            tCtx.clearRect(0, 0, tilesetCanvas.width, tilesetCanvas.height);
            tCtx.fillStyle = '#111'; tCtx.fillRect(0, 0, tilesetCanvas.width, tilesetCanvas.height);
            tCtx.drawImage(tilesetImage, imgOffsetX, imgOffsetY);
            
            tCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; tCtx.lineWidth = 1;
            let startX = imgOffsetX % TILE_SIZE;
            if (startX < 0) startX += TILE_SIZE;
            for(let i = startX; i <= tilesetCanvas.width; i += TILE_SIZE) { 
                tCtx.beginPath(); tCtx.moveTo(i, 0); tCtx.lineTo(i, tilesetCanvas.height); tCtx.stroke(); 
            }
            let startY = imgOffsetY % TILE_SIZE;
            if (startY < 0) startY += TILE_SIZE;
            for(let i = startY; i <= tilesetCanvas.height; i += TILE_SIZE) { 
                tCtx.beginPath(); tCtx.moveTo(0, i); tCtx.lineTo(tilesetCanvas.width, i); tCtx.stroke(); 
            }
        }

        function isAreaTransparent(img, x, y, w, h) {
            if (!img) return true;
            const tempC = document.createElement('canvas'); tempC.width = w; tempC.height = h;
            const tempCtx = tempC.getContext('2d');
            try { tempCtx.drawImage(img, x, y, w, h, 0, 0, w, h); } catch (error) { return true; }
            const imgData = tempCtx.getImageData(0, 0, w, h).data;
            for (let i = 3; i < imgData.length; i += 4) { if (imgData[i] > 0) return false; }
            return true; 
        }

        tilesetCanvas.addEventListener('pointerdown', function(e) {
            if (!tilesetImage) return;
            const rect = tilesetCanvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            if (isMoveMode) {
                isDraggingImage = true; dragStartX = clickX - imgOffsetX; dragStartY = clickY - imgOffsetY; tilesetCanvas.style.cursor = 'grabbing';
            } else {
                let relX = clickX - imgOffsetX;
                let relY = clickY - imgOffsetY;
                let col = Math.floor(relX / TILE_SIZE);
                let row = Math.floor(relY / TILE_SIZE);

                let imgX = col * TILE_SIZE;
                let imgY = row * TILE_SIZE;

                if (isAreaTransparent(tilesetImage, imgX, imgY, TILE_SIZE, TILE_SIZE)) return;

                selectedTile = { img: tilesetImage, x: imgX, y: imgY, w: TILE_SIZE, h: TILE_SIZE };
                addSlotHistory(selectedTile);
            }
        });

        tilesetCanvas.addEventListener('pointermove', function(e) {
            if (!tilesetImage || !isDraggingImage) return;
            const rect = tilesetCanvas.getBoundingClientRect();
            let currentX = e.clientX - rect.left;
            let currentY = e.clientY - rect.top;

            let newX = currentX - dragStartX; 
            let newY = currentY - dragStartY;

            let minX = -tilesetImage.width + TILE_SIZE; 
            let maxX = tilesetCanvas.width - TILE_SIZE;
            let minY = -tilesetImage.height + TILE_SIZE;
            let maxY = tilesetCanvas.height - TILE_SIZE;
            
            newX = Math.max(minX, Math.min(newX, maxX)); 
            newY = Math.max(minY, Math.min(newY, maxY));
            
            if (isSnapMode) {
                newX = Math.round(newX / TILE_SIZE) * TILE_SIZE;
                newY = Math.round(newY / TILE_SIZE) * TILE_SIZE;
                newX = Math.max(minX, Math.min(newX, maxX));
                newY = Math.max(minY, Math.min(newY, maxY));
            }

            imgOffsetX = newX; imgOffsetY = newY; drawTileset();
        });

        window.addEventListener('pointerup', function(e) {
            if (isDraggingImage) { isDraggingImage = false; tilesetCanvas.style.cursor = 'grab'; return; }
        });

        function addSlotHistory(tile) {
            const isDuplicate = slotHistory.some(t => t.img === tile.img && t.x === tile.x && t.y === tile.y && t.w === tile.w && t.h === tile.h);
            if (isDuplicate) return;
            slotHistory.unshift(tile); if (slotHistory.length > 10) slotHistory.pop(); renderSlots();
        }

        function renderSlots() {
            const container = document.getElementById('tileSlots'); container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const slot = document.createElement('div'); slot.className = 'tile-slot';
                if (slotHistory[i]) {
                    const tile = slotHistory[i]; const c = document.createElement('canvas'); c.width = 40; c.height = 40;
                    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
                    if(tile.img) {
                        ctx.drawImage(tile.img, tile.x, tile.y, tile.w, tile.h, 0, 0, 40, 40);
                    }
                    slot.appendChild(c);
                    
                    slot.onclick = () => { 
                        selectedTile = slotHistory[i]; 
                        document.querySelectorAll('.tile-slot').forEach(s => s.classList.remove('selected')); 
                        slot.classList.add('selected'); 
                    };
                    
                    if (selectedTile && selectedTile.img === tile.img && selectedTile.x === tile.x && selectedTile.y === tile.y) { 
                        slot.classList.add('selected'); 
                    }
                }
                container.appendChild(slot);
            }
        }

        function transformMapTile(action) {
            if (!isTransforming) return; saveState();
            const tempC = document.createElement('canvas'); tempC.width = TILE_SIZE; tempC.height = TILE_SIZE;
            const tempCtx = tempC.getContext('2d');
            tempCtx.drawImage(mapCanvas, transX, transY, TILE_SIZE, TILE_SIZE, 0, 0, TILE_SIZE, TILE_SIZE);
            mCtx.clearRect(transX, transY, TILE_SIZE, TILE_SIZE);
            mCtx.save(); mCtx.translate(transX + TILE_SIZE / 2, transY + TILE_SIZE / 2);
            if (action === 'left') mCtx.rotate(-Math.PI / 2);
            else if (action === 'right') mCtx.rotate(Math.PI / 2);
            else if (action === 'mirrorH') mCtx.scale(-1, 1);
            else if (action === 'mirrorV') mCtx.scale(1, -1);
            mCtx.drawImage(tempC, -TILE_SIZE / 2, -TILE_SIZE / 2); mCtx.restore();
            saveAutoSave();
        }

        window.addEventListener('pointerdown', (e) => { 
            activePointers.add(e.pointerId); 
            if (activePointers.size > 1) { isDrawing = false; }
        }, true);
        
        window.addEventListener('pointerup', (e) => { activePointers.delete(e.pointerId); }, true);
        window.addEventListener('pointercancel', (e) => { activePointers.delete(e.pointerId); }, true);

        let initialDist = 0, initialPinchZoom = 1, initialPanX = 0, initialPanY = 0, startFocalX = 0, startFocalY = 0, isPinching = false, containerRect;
        
        canvasContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isDrawing = false;
                isPinching = true;
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initialPinchZoom = zoomLevel; initialPanX = panX; initialPanY = panY;
                containerRect = canvasContainer.getBoundingClientRect();
                startFocalX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - containerRect.left;
                startFocalY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - containerRect.top;
            }
        }, {passive: false});

        canvasContainer.addEventListener('touchmove', (e) => {
            if (isPinching && e.touches.length === 2) {
                e.preventDefault();
                let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                let newZoom = initialPinchZoom * (dist / initialDist); newZoom = Math.min(Math.max(newZoom, 0.1), 4);
                const currentFocalX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - containerRect.left;
                const currentFocalY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - containerRect.top;
                const scaleChange = newZoom / initialPinchZoom;
                panX = currentFocalX - (startFocalX - initialPanX) * scaleChange;
                panY = currentFocalY - (startFocalY - initialPanY) * scaleChange;
                zoomLevel = newZoom; updateTransform();
            }
        }, {passive: false});
        
        canvasContainer.addEventListener('touchend', (e) => { if (e.touches.length < 2) isPinching = false; });

        canvasContainer.addEventListener('pointerdown', function(e) { 
            if (e.pointerType === 'touch' && (activePointers.size > 1 || isPinching)) {
                isDrawing = false;
                return;
            }

            if (currentTool === 'hand') {
                let startX = e.clientX, startY = e.clientY, startPanX = panX, startPanY = panY;
                function onPointerMove(e) { panX = startPanX + (e.clientX - startX); panY = startPanY + (e.clientY - startY); updateTransform(); }
                function onPointerUp() { window.removeEventListener('pointermove', onPointerMove); window.removeEventListener('pointerup', onPointerUp); }
                window.addEventListener('pointermove', onPointerMove); window.addEventListener('pointerup', onPointerUp); return;
            }
            if(e.target === mapCanvas) { 
                isDrawing = true; 
                saveState(); 
                draw(e); 
            }
        });

        mapCanvas.addEventListener('pointermove', function(e) { 
            if (e.pointerType === 'touch' && (activePointers.size > 1 || isPinching)) return;
            if (!isDrawing || isPinching) return;

            if (currentTool === 'brush') draw(e); 
            if (currentTool === 'eraser') draw(e); 
        });
        
        window.addEventListener('pointerup', function() { 
            if (isDrawing) {
                isDrawing = false; 
                saveAutoSave();
            }
        });

        function draw(e) {
            const rect = mapCanvas.getBoundingClientRect();
            const scaleX = mapCanvas.width / rect.width; const scaleY = mapCanvas.height / rect.height;
            const realX = (e.clientX - rect.left) * scaleX; const realY = (e.clientY - rect.top) * scaleY;
            const x = Math.floor(realX / TILE_SIZE) * TILE_SIZE; const y = Math.floor(realY / TILE_SIZE) * TILE_SIZE;
            if (x < 0 || x >= MAP_WIDTH || y < 0 || y >= MAP_HEIGHT) return;

            if (currentTool === 'brush' && selectedTile.img) {
                mCtx.drawImage(selectedTile.img, selectedTile.x, selectedTile.y, selectedTile.w, selectedTile.h, x, y, selectedTile.w, selectedTile.h);
            } else if (currentTool === 'eraser') {
                mCtx.clearRect(x, y, TILE_SIZE, TILE_SIZE);
            } else if (currentTool === 'transform') {
                const imgData = mCtx.getImageData(x, y, TILE_SIZE, TILE_SIZE).data;
                let hasPixels = false;
                for (let i = 3; i < imgData.length; i += 4) { if (imgData[i] > 0) { hasPixels = true; break; } }
                if (!hasPixels) return; 

                transX = x; transY = y; isTransforming = true; 
                document.getElementById('transformPanel').style.display = 'flex'; 
                isDrawing = false;
                sCtx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT); sCtx.strokeStyle = '#00ff00'; sCtx.lineWidth = 2; sCtx.setLineDash([4, 4]); sCtx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
            }
        }

        renderSlots();
    </script>
</body>
</html>
